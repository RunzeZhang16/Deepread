services:
  app:
    build: .
    container_name: deepread-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/deepread.db
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    volumes:
      - ./data:/app/data
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: deepread-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # 有域名和证书后再放开 443
      # - "443:443"
    volumes:
      - ./ops/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./ops/certs:/etc/nginx/certs:ro
    depends_on:
      - app
